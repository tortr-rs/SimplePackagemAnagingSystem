[package]
name = "simple-packagem-anaging-system"
version = "0.3.0"
edition = "2024"
license = "BSD-2-Clause"
description = "SimplePackagemAnagingSystem (SPAS): a native package manager for Gentoo repositories"

[[bin]]
name = "hoard"
path = "src/main.rs"

[dependencies]
blake2 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
bzip2 = "0.4"
flate2 = "1"
libc = "0.2"
ureq = "2"
regex = "1"
tar = { version = "0.4", features = ["xattr"] }
xz2 = "0.1"
zstd = "0.13"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
