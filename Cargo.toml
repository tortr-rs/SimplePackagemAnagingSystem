[package]
name = "simple-packagem-anaging-system"
version = "0.1.0"
edition = "2024"
description = "SimplePackagemAnagingSystem (SPAS): a native package manager for Gentoo repositories"
license = "GPL-2.0-only"

[[bin]]
name = "hoard"
path = "src/main.rs"

[dependencies]
blake2 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
bzip2 = "0.4"
flate2 = "1"
libc = "0.2"
ureq = "2"
regex = "1"
tar = { version = "0.4", features = ["xattr"] }
xz2 = "0.1"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
